  const channels = value.match(/[\d.]+/g).map(Number);

    const alpha=pixels[i+3]/255,color=[0,1,2].map(c=>pixels[i+c]*alpha+255*(1-alpha));

function contrast(id,pseudo) {
  const el=document.getElementById(id);

  const layers=[];

    const under=composite(color,base.map(channel=>channel*brightness));

    return texture?composite('rgba(24,17,27,.12)',texture):under;
